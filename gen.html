                <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - Image Generator</title>
    <link rel="stylesheet" href="gen.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="generator-container">
        <!-- Top Navigation Bar -->
        <header class="top-nav glass-card">
            <div class="brand">
                <span class="logo-icon">✨</span>
                <h1>AI Studio</h1>
            </div>

            <div class="nav-actions">
                <!-- Single Profile Dropdown -->
                <div class="profile-dropdown">
                    <button id="profileMenuBtn" class="profile-btn">
                        <div id="userAvatarLetter">A</div>
                        <span id="displayProfileName">User</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div id="profileDropdownMenu" class="dropdown-menu hidden">
                        <div class="dropdown-header">
                            <div id="userAvatarLetterBig">A</div>
                            <span id="displayProfileNameBig">User</span>
                        </div>
                        <a href="#" id="openHistoryBtn">📜 History</a>
                        <a href="set.html">⚙️ Settings</a>
                        <a href="auth.html">🚪 Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Left Panel: Input & Controls -->
            <section class="control-panel glass-card">
                <div class="panel-header">
                    <h2>Prompt Studio</h2>
                    <p>Describe the image you want to generate</p>
                </div>

                <div class="input-group">
                    <label for="imagePrompt">Enter Prompt</label>
                    <textarea id="imagePrompt" class="form-textarea" placeholder="e.g., A futuristic cyberpunk city in rain, neon lights, highly detailed 8k..." rows="5"></textarea>
                </div>

                <div class="input-group">
                    <label for="aspectRatio">Aspect Ratio</label>
                    <select id="aspectRatio" class="custom-select">
                        <option value="1:1">1:1 (Square)</option>
                        <option value="16:9">16:9 (Landscape)</option>
                        <option value="9:16">9:16 (Portrait)</option>
                        <option value="4:3">4:3 (Standard)</option>
                    </select>
                </div>

                <button id="generateBtn" class="btn-glow btn-full">✨ Generate Image</button>
            </section>

            <!-- Right Panel: Output & Preview -->
            <section class="preview-panel glass-card">
                <div class="panel-header">
                    <h2>Generated Output</h2>
                    <p>Your AI generated artwork will appear below</p>
                </div>

                <div id="imageDisplayArea" class="display-box">
                    <div id="loader" class="loader hidden"></div>
                    <div id="placeholderText" class="placeholder">
                        <span class="placeholder-icon">🖼️</span>
                        <p>No image generated yet. Enter a prompt and click Generate!</p>
                    </div>
                    <img id="generatedImage" class="result-image hidden" alt="Generated Artwork">
                </div>

                <div id="imageActions" class="image-actions hidden">
                    <a id="downloadImageBtn" class="btn-glow btn-full" download="ai-image.png">📥 Download Image</a>
                </div>
            </section>
        </main>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal-overlay hidden">
        <div class="modal-card glass-card">
            <div class="modal-header">
                <div>
                    <h3>📜 History Logs</h3>
                    <p>Click any prompt to load it</p>
                </div>
                <button id="closeHistoryBtn" class="close-btn">✕</button>
            </div>
            <div id="historyListContainer" class="history-list"></div>
            <div class="modal-footer">
                <button id="clearHistoryBtn" class="btn-danger">🗑️ Clear History</button>
            </div>
        </div>
    </div>

    <script src="gen.js"></script>
</body>
        </html>
